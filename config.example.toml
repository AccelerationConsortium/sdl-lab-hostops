# lab-hostops per-host configuration.
# Copy to config.toml (or <host>.local.toml — *.local.toml is gitignored) and
# edit for the machine. Secrets never go here: HOSTOPS_TOKEN and
# HOSTOPS_INGEST_URL are environment variables.

[hostops]
# Used as device_id in audit rows and equipment_id in the /status envelope.
equipment_id = "hostops_example_pc"

# "stdio": spawned per-connection by the MCP client (same machine, or over
#          SSH for the daemonless Pi "lite" mode). No token needed.
# "http":  long-lived service (NSSM / systemd). A non-loopback bind refuses
#          to start unless HOSTOPS_TOKEN is set.
transport = "http"
host = "0.0.0.0"
port = 8060

# NSSM backend only: directory holding <service>.out.log / <service>.err.log.
# log_dir = "C:/SDL_Logs"

# systemd backend only: prefix restarts with `sudo -n` (requires a sudoers
# drop-in for exactly those units — see README).
use_sudo = false

[services]
# Only these services can be inspected AT ALL (status + log tail).
whitelist = ["plateloc", "xarm", "cytation", "torry-pines-shaker", "biostack4"]
# The subset restart_service may touch. Empty list = read-only instance.
restartable = ["plateloc", "torry-pines-shaker"]

[probe]
# Local ports probe_local_status may GET /status on (loopback only).
ports = [8000, 8010, 8030, 8040, 8050]
# Gateway-style services 404 on bare /status; override the path per port:
# paths = { 8030 = "/zones/env_hte/status" }

# ---------------------------------------------------------------------------
# [checks] — OPTIONAL host health. Omit the section entirely and /status keeps
# its liveness-only behaviour (always "ready" while the process is up).
# Every enabled check that cannot run marks its own component "unknown", which
# leaves the host "degraded" with the reason named — never a green tile.
# Only enable what actually works on the host: a permanently-unknown check
# means a permanently-amber tile, which trains people to ignore it.
# ---------------------------------------------------------------------------
# [checks]
# disks = ["/", "/var", "/home"]      # per-mount used% and free GB
# disk_warn_pct = 90.0
# disk_crit_pct = 95.0
# disk_min_free_warn_gb = 2.0   # absolute floor: a ratio cannot see a small
# disk_min_free_crit_gb = 1.0   # partition nearly full (9 GB /var at 69%)
# zfs_pool = "tank"                   # `zpool status -x` + capacity
# zfs_warn_pct = 80.0
# zfs_crit_pct = 90.0
# backup_log = "/home/sdl2/storage/internal/backups/backup.log"
# backup_max_age_hours = 26.0         # nightly job + margin
# backup_warn_patterns = ["postgres: not published"]
# user_units = ["la-agente-chat"]     # needs user_runtime_dir: a system
# user_runtime_dir = "/run/user/1000" # service has no session bus otherwise
# docker_containers = ["analytica-postgres"]   # needs docker socket access
# gpu = true                          # nvidia-smi memory used/total
# ttl_seconds = 20.0                  # cache; keep below the poll interval
# timeout_seconds = 3.0               # per check
