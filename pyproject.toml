[project]
name = "lab-hostops"
version = "0.1.0"
description = "Whitelisted host-operations MCP server for SDL2 lab machines: service status/logs/restart, serial-port enumeration, local STATUS_SPEC probes. Deliberately NO hardware control and NO shell."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Yang Cao" }]
dependencies = [
    # Deliberately tiny dependency set — Pi Zero 2W is a supported host.
    # mcp 2.x dropped its httpx dependency, so the status probe + audit
    # declare it themselves.
    "mcp>=1.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Windows COM-port enumeration needs pyserial; Linux has a /dev glob fallback.
serial = ["pyserial>=3.5"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
lab-hostops-serve = "lab_hostops.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab_hostops"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
